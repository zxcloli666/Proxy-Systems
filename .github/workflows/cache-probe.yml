name: cache-probe

on:
  push:
    branches: [ci/fast]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Repository name lowercase
        id: repo
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=${REPO,,}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push simple-proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: simple-proxy
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner }}/cache/proxy-systems:glibc
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner }}/cache/proxy-systems:glibc,mode=max

      - name: Build and push simple-ipv6-proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: simple-ipv6-proxy
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner }}/cache/proxy-systems:glibc

      - name: Build and push intermediate-proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: intermediate-proxy
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner }}/cache/proxy-systems:musl
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner }}/cache/proxy-systems:musl,mode=max

      - name: Build and push tor-proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: tor-proxy
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner }}/cache/proxy-systems:musl
